[project]
name = "agno-lark"
version = "0.1.0"
description = "A lightweight Python bridge between Lark/Feishu and Agno AgentOS."
readme = "README.md"
authors = [
    { name = "_白开水_", email = "pkk518@gmail.com" }
]
requires-python = ">=3.12,<4"
dependencies = [
    "agno[os]>=3.1,<4",
    "aiosqlite>=0.20,<1",
    "httpx[socks]>=0.28,<1",
    "lark-channel-sdk>=1.4,<2",
    "pydantic-settings>=2.6,<3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[project.scripts]
agno-lark = "agno_lark.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
